# Supabase Configuration
# See: https://supabase.com/docs/guides/cli/config

project_id = "your-project-id"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:8081", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

# Adds the ai_consent claim (20261119120100_ai_consent_token_hook.sql). Hosted projects enable it
# through the dashboard or the Management API, see supabase/README.md.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.apple]
enabled = false

[auth.external.google]
enabled = true
client_id = "822716203653-3tmfmkp78mrdi103hgjc6ucmhdpf21ti.apps.googleusercontent.com"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[auth.external.github]
enabled = false

# These functions check the caller themselves: qr-start and qr-poll take no sign-in, and the others
# verify the access token against the project's signing keys (functions/_shared/http.ts).
[functions.delete-account]
verify_jwt = false

[functions.qr-start]
verify_jwt = false

[functions.qr-approve]
verify_jwt = false

[functions.qr-poll]
verify_jwt = false

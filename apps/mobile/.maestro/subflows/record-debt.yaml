# Records "${PERSON} owes me RM50" with the note ${PERSON} lunch, from the Debts tab, and ends back there.
appId: com.anonymous.moni.e2e
---
- tapOn:
    id: debts.record-debt
- tapOn:
    id: debts.new.person
- inputText: ${PERSON}
- hideKeyboard
- tapOn:
    id: debts.key.5
- tapOn:
    id: debts.key.0
- tapOn:
    id: debts.new.note
- inputText: ${PERSON} lunch
- hideKeyboard
- tapOn:
    id: debts.submit
- assertVisible: People
- scrollUntilVisible:
    element:
      id: 'debts\.person\..*'
      text: ${PERSON} owes you RM50\.00
    centerElement: true
- tapOn:
    id: 'debts\.person\..*'
    text: ${PERSON} owes you RM50\.00

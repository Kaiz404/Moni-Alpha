# Signs in with email and password from a signed-out e2e build.
# Pass E2E_EMAIL and E2E_PASSWORD with maestro test -e. run-flows.sh passes them from .env.e2e.
appId: com.anonymous.moni.e2e
---
- extendedWaitUntil:
    visible:
      id: auth.email
    timeout: 15000
- tapOn:
    id: auth.mode.sign-in
- tapOn:
    id: auth.email
- eraseText: 80
- inputText: ${E2E_EMAIL}
# The keyboard shifts the form while it opens, so a tap measured mid-shift can land on Email.
- hideKeyboard
- tapOn:
    id: auth.password
- eraseText: 80
# Screenshots and failure captures must never show this password: stop here if it would be readable,
# or if Email still has focus and would show it in the clear.
- assertVisible:
    id: auth.password.reveal
    text: Show password
- assertVisible:
    id: auth.password
    focused: true
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: auth.sign-in
- extendedWaitUntil:
    visible:
      id: home.avatar
    timeout: 20000

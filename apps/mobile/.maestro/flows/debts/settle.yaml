# D1 settle: Paid back in full squares the debt this flow records, and it moves to Settled.
# Run: scripts/device/run-flows.sh .maestro/flows/debts/settle.yaml
appId: com.anonymous.moni.e2e
name: D1 settle a debt
tags:
  - d1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: nav.tab.debts
    timeout: 15000
- tapOn:
    id: nav.tab.debts
- runFlow:
    file: ../../subflows/record-debt.yaml
    env:
      PERSON: Suresh
- tapOn:
    id: debts.settle
- assertVisible: All square with Suresh
- assertVisible: Paid in full
- assertVisible: Undo
- takeScreenshot: d1-l6-settled
- tapOn:
    id: debts.done
- scrollUntilVisible:
    element:
      id: debts.settled.toggle
    centerElement: true
- tapOn:
    id: debts.settled.toggle
- scrollUntilVisible:
    element:
      id: 'debts\.settled\..*'
      text: 'Suresh, Settled · Suresh lunch, .*'
    centerElement: true
- takeScreenshot: d1-l6-settled-list

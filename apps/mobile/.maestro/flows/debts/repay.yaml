# D1 repayment: Rina pays back RM20 of the RM50 this flow records.
# Run: scripts/device/run-flows.sh .maestro/flows/debts/repay.yaml
appId: com.anonymous.moni.e2e
name: D1 record a repayment
tags:
  - d1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: nav.tab.debts
    timeout: 15000
- tapOn:
    id: nav.tab.debts
- runFlow:
    file: ../../subflows/record-debt.yaml
    env:
      PERSON: Rina
- assertVisible: RINA OWES YOU
- assertVisible: RM50.00
- tapOn:
    id: debts.record-repayment
- assertVisible: Rina paid you back
- assertVisible: That settles it. Rina will owe you nothing
# The suggested full amount is replaced by the first key.
- tapOn:
    id: debts.key.2
- tapOn:
    id: debts.key.0
- assertVisible: Rina will still owe you RM30.00
- tapOn:
    id: debts.submit
- assertVisible: Recorded RM20.00
- assertVisible: RM30.00
- assertVisible: RM20.00 of RM50.00 paid back
- takeScreenshot: d1-l1-repaid

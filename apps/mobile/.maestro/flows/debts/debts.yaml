# D1 Debts tab: the hero tiles filter the list in place (D5), and a
# debt row opens the debt page. Needs at least one open debt owed to the user.
# Run: scripts/device/run-flows.sh .maestro/flows/debts/debts.yaml
appId: com.anonymous.moni.e2e
name: D1 Debts tab
tags:
  - d1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: nav.tab.debts
    timeout: 15000
- tapOn:
    id: nav.tab.debts
- assertVisible:
    id: debts.record-debt
- takeScreenshot: d1-l2-pair
# Both sides start ticked: untick You owe to keep to Owed to you.
- tapOn:
    id: debts.filter.side
- tapOn:
    id: sheet.option.i-owe
- tapOn:
    id: sheet.apply
- assertVisible:
    id: 'debts\.person\..*'
    text: '.* owes you .*'
- assertNotVisible:
    id: 'debts\.person\..*'
    text: 'You owe .*'
- takeScreenshot: d1-l3-filter
- tapOn:
    id: debts.filter.side
- tapOn:
    id: sheet.select-all
- tapOn:
    id: sheet.apply
- assertVisible: Records
- scrollUntilVisible:
    element:
      id: debts\.person\..*
    centerElement: true
- tapOn:
    id: debts\.person\..*
    index: 0
- assertVisible: History
- takeScreenshot: d1-l4-person

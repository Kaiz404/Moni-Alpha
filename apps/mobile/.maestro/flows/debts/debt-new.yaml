# D1 Record a debt: Hana owes me RM50, lent from the first MYR wallet. The seed's Hana is settled,
# so her new debt must reach People and the Owed to you total, with the old one still under Settled.
# Run: scripts/device/run-flows.sh .maestro/flows/debts/debt-new.yaml
appId: com.anonymous.moni.e2e
name: D1 record a debt
tags:
  - d1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: nav.tab.debts
    timeout: 15000
- tapOn:
    id: nav.tab.debts
- runFlow:
    when:
      visible:
        id: debts.empty.record-debt
    commands:
      - tapOn:
          id: debts.empty.record-debt
- runFlow:
    when:
      visible:
        id: debts.record-debt
    commands:
      - tapOn:
          id: debts.record-debt
- assertVisible: Add who and an amount
- assertVisible: They owe me
- assertVisible: I owe them
# The drawer keeps to the side that is selected: Mei is someone I owed, so she shows only on that side.
- tapOn:
    id: debts.direction.i-owe
- tapOn:
    id: debts.new.people
- assertVisible: People you owed
- assertVisible:
    id: sheet.option.mei
- assertNotVisible:
    id: sheet.option.hana
- tapOn:
    id: sheet.scrim
- tapOn:
    id: debts.direction.owed-to-me
# Hana is settled and Aiman is open, and both have owed me. Picking fills the field.
- tapOn:
    id: debts.new.people
- assertVisible: People who owed you
- assertVisible:
    id: sheet.option.aiman
- assertNotVisible:
    id: sheet.option.mei
- tapOn:
    id: sheet.option.hana
- assertVisible:
    id: debts.new.person
    text: Hana
# The name stays in its field: the control keeps its own words.
- assertVisible: They owe me
- assertVisible: I owe them
- assertNotVisible: Hana owes me
- assertVisible: Add an amount
- tapOn:
    id: debts.key.5
- tapOn:
    id: debts.key.0
- assertVisible: RM50
- assertNotVisible: Hana will owe you RM50.00
- assertVisible: They owe me
- assertVisible: 'Record: Hana owes you RM50.00'
- tapOn:
    id: debts.new.note
- inputText: Lunch
- hideKeyboard
- takeScreenshot: d1-l5-new-form
- tapOn:
    id: debts.submit
- assertVisible: People
- assertNotVisible:
    id: debts.tile.owed-to-me
    text: Owed to you RM150
- scrollUntilVisible:
    element:
      id: 'debts\.person\..*'
      text: Hana owes you RM50\.00
    centerElement: true
- takeScreenshot: d1-l5-new
- scrollUntilVisible:
    element:
      id: debts.settled.toggle
    centerElement: true
- tapOn:
    id: debts.settled.toggle
- scrollUntilVisible:
    element:
      id: 'debts\.settled\..*'
      text: 'Hana, Settled · Lunch, .*'
    centerElement: true

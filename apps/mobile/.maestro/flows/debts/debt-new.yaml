# D1 Record a debt: Hana owes me RM50, lent from the first MYR wallet. The seed's Hana is settled,
# so her new debt must reach People and the Owed to you total, with the old one still under Settled.
# Run: scripts/device/run-flows.sh .maestro/flows/debts/debt-new.yaml
appId: com.anonymous.moni.e2e
name: D1 record a debt
tags:
  - d1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: nav.tab.debts
    timeout: 15000
- tapOn:
    id: nav.tab.debts
- runFlow:
    when:
      visible:
        id: debts.empty.record-debt
    commands:
      - tapOn:
          id: debts.empty.record-debt
- runFlow:
    when:
      visible:
        id: debts.record-debt
    commands:
      - tapOn:
          id: debts.record-debt
- assertVisible: Add who and an amount
- tapOn:
    id: debts.new.person
- inputText: Hana
- hideKeyboard
- assertVisible: Hana owes me
- tapOn:
    id: debts.new.amount
- tapOn:
    id: debts.key.5
- tapOn:
    id: debts.key.0
- assertVisible: Hana will owe you RM50.00
- tapOn:
    id: debts.submit
- assertVisible: RM50.00
- tapOn:
    id: debts.new.note
- inputText: Lunch
- hideKeyboard
- takeScreenshot: d1-l5-new-form
- tapOn:
    id: debts.new.record
- assertVisible: People
- assertNotVisible:
    id: debts.tile.owed-to-me
    text: Owed to you RM150
- scrollUntilVisible:
    element:
      id: 'debts\.person\..*'
      text: Hana owes you RM50\.00
    centerElement: true
- takeScreenshot: d1-l5-new
- scrollUntilVisible:
    element:
      id: debts.settled.toggle
    centerElement: true
- tapOn:
    id: debts.settled.toggle
- scrollUntilVisible:
    element:
      id: 'debts\.settled\..*'
      text: 'Hana, Settled · Lunch, .*'
    centerElement: true

# R1 lanes 8 and 10: swipes clear the queue and the deck ends on All caught up.
# Needs the full seed's pending captures, one of them with no wallet
# (the Moni chat parking capture in the board sample).
# Run: scripts/device/run-flows.sh .maestro/flows/review/decide-all.yaml
appId: com.anonymous.moni.e2e
name: R1 Review deck decide all
tags:
  - r1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- openLink: moni-e2e://review
- extendedWaitUntil:
    visible:
      id: review.card
    timeout: 10000
- assertVisible: Not mine
- assertVisible: Later
- assertVisible: Approve

- runFlow: ../../subflows/review-not-mine.yaml
- extendedWaitUntil:
    visible: 1 not mine
    timeout: 3000

# Approve the rest. A capture with no wallet asks for one; nothing is written until it is picked.
- repeat:
    times: 6
    while:
      visible:
        id: review.card
    commands:
      - runFlow:
          when:
            visible: Needs a wallet
          commands:
            - assertVisible: Pick wallet
            - runFlow: ../../subflows/review-approve.yaml
            - assertVisible: Which wallet?
            - takeScreenshot: r1-l8-needs-wallet
            - tapOn:
                id: 'sheet\.option\..*'
                index: 0
            - assertNotVisible: Needs a wallet
      - runFlow: ../../subflows/review-approve.yaml
      - extendedWaitUntil:
          visible: 'Approved .*'
          timeout: 3000

- extendedWaitUntil:
    visible: All caught up
    timeout: 5000
- assertVisible:
    id: review.capture-log
- assertVisible: '.* approved, 1 not mine.*'
- takeScreenshot: r1-l10-caught-up
- tapOn:
    id: review.capture-log
- assertVisible:
    id: capture-log.back

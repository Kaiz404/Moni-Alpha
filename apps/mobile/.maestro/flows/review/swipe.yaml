# R1 lanes 3 to 6: swipe the top card right, left, down, and a short slow drag that snaps back.
# Needs the full seed's four pending captures. It decides the first three, which each have a wallet.
# Run: scripts/device/run-flows.sh .maestro/flows/review/swipe.yaml
appId: com.anonymous.moni.e2e
name: R1 swipe the Review deck
tags:
  - r1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- openLink: moni-e2e://review
- extendedWaitUntil:
    visible:
      id: review.card
    timeout: 10000
- assertVisible:
    id: review.next-card
- takeScreenshot: r1-l2-pair

# A short, slow drag stays short of the 45 percent an option takes: the card comes back and nothing is written.
- swipe:
    start: 50%, 40%
    end: 62%, 40%
    duration: 2000
- assertVisible:
    id: review.card
- assertNotVisible: 'Approved .*'
- takeScreenshot: r1-l6-snap-back

# Starts near the card's far edge: from its centre a swipe ends barely past the 45 percent.
- swipe:
    start: 15%, 40%
    end: 90%, 40%
    duration: 400
- extendedWaitUntil:
    visible: 'Approved .*'
    timeout: 3000
- assertVisible:
    id: nav.toast.undo
- takeScreenshot: r1-l3-swipe-right

- swipe:
    start: 85%, 40%
    end: 10%, 40%
    duration: 400
- extendedWaitUntil:
    visible: 1 not mine
    timeout: 3000
- takeScreenshot: r1-l4-swipe-left

- swipe:
    from:
      id: review.card
    direction: DOWN
- extendedWaitUntil:
    visible: Saved for later
    timeout: 3000
- takeScreenshot: r1-l5-swipe-down

- tapOn:
    id: nav.toast.undo
- assertNotVisible: Saved for later
- assertVisible:
    id: review.card
- takeScreenshot: r1-undo-later

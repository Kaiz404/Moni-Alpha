# R1 lanes 3 to 6: swipe the top card right, left, down, and a short slow drag that snaps back.
# Needs a signed-in e2e build and at least four pending captures that each have a wallet.
# Run: scripts/device/with-device.sh --lane r1 -- maestro test .maestro/flows/review/swipe.yaml
appId: com.anonymous.moni.e2e
name: R1 swipe the Review deck
tags:
  - r1
  - needs-pending-proposals
---
- launchApp
- extendedWaitUntil:
    visible:
      id: home.avatar
    timeout: 15000
- openLink: moni-e2e://review
- extendedWaitUntil:
    visible:
      id: review.card
    timeout: 10000
- assertVisible:
    id: review.next-card
- takeScreenshot: r1-l2-pair

# A short, slow drag stays under 40 percent: the card comes back and nothing is written.
- swipe:
    start: 50%, 40%
    end: 62%, 40%
    duration: 2000
- assertVisible:
    id: review.card
- assertNotVisible: 'Approved .*'
- takeScreenshot: r1-l6-snap-back

- swipe:
    from:
      id: review.card
    direction: RIGHT
- extendedWaitUntil:
    visible: 'Approved .*'
    timeout: 3000
- assertVisible:
    id: nav.toast.undo
- takeScreenshot: r1-l3-swipe-right

- swipe:
    from:
      id: review.card
    direction: LEFT
- extendedWaitUntil:
    visible: 1 not mine
    timeout: 3000
- takeScreenshot: r1-l4-swipe-left

- swipe:
    from:
      id: review.card
    direction: DOWN
- extendedWaitUntil:
    visible: Saved for later
    timeout: 3000
- takeScreenshot: r1-l5-swipe-down

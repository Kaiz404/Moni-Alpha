# R1 lanes 3 to 6: swipe the top card right from near the edge, left, down, and a short slow drag that snaps back.
# Needs the full seed's four pending captures. It decides the first three, which each have a wallet.
# Run: scripts/device/run-flows.sh .maestro/flows/review/swipe.yaml
appId: com.anonymous.moni.e2e
name: R1 swipe the Review deck
tags:
  - r1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- openLink: moni-e2e://review
- extendedWaitUntil:
    visible:
      id: review.card
    timeout: 10000
- assertVisible:
    id: review.next-card
- takeScreenshot: r1-l2-pair

# A short, slow drag from the centre stays short of the 60 percent of the room to the edge that an option takes there: the card comes back and nothing is written.
- swipe:
    start: 50%, 50%
    end: 62%, 50%
    duration: 2000
- assertVisible:
    id: review.card
- assertNotVisible: 'Approved .*'
- takeScreenshot: r1-l6-snap-back

# Starts near the right edge and moves slowly, so distance alone has to light Approve with the little room there is.
- swipe:
    start: 86%, 50%
    end: 98%, 50%
    duration: 800
- extendedWaitUntil:
    visible: 'Approved .*'
    timeout: 3000
- assertVisible:
    id: nav.toast.undo
- takeScreenshot: r1-l3-swipe-right

- swipe:
    start: 85%, 50%
    end: 10%, 50%
    duration: 400
- extendedWaitUntil:
    visible: 1 not mine
    timeout: 3000
- takeScreenshot: r1-l4-swipe-left

- swipe:
    from:
      id: review.card
    direction: DOWN
- extendedWaitUntil:
    visible: Saved for later
    timeout: 3000
- takeScreenshot: r1-l5-swipe-down

- tapOn:
    id: nav.toast.undo
- assertNotVisible: Saved for later
- assertVisible:
    id: review.card
- takeScreenshot: r1-undo-later

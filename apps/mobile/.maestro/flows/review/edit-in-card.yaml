# R1 lanes 7 and 9: edit the amount in place, check the swipe is off while editing,
# then tick Don't ask about similar and approve the edited amount.
# Needs a pending notification capture with a wallet first in the queue.
# Run: scripts/device/run-flows.sh .maestro/flows/review/edit-in-card.yaml
appId: com.anonymous.moni.e2e
name: R1 edit in the Review card
tags:
  - r1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- openLink: moni-e2e://review
- extendedWaitUntil:
    visible:
      id: review.card
    timeout: 10000

- tapOn:
    id: review.amount.edit
- assertVisible:
    id: review.amount.input
- eraseText: 12
- inputText: '15.50'

# The pan is off while a field edits: the card stays and nothing is decided.
- swipe:
    from:
      id: review.card
    direction: RIGHT
- assertVisible:
    id: review.amount.input
- assertNotVisible: 'Approved .*'
- takeScreenshot: r1-l7-edit

- tapOn:
    id: review.amount.save
- assertVisible: '.*RM15\.50'
- tapOn:
    id: review.similar
- tapOn:
    id: review.approve
- extendedWaitUntil:
    visible: 'Approved .* .RM15\.50'
    timeout: 3000
- takeScreenshot: r1-l9-similar

# B1 Calendar view (V2P-InsightsCalendar): heat by day, the picked day's rows, top merchants.
# Needs at least one MYR wallet.
# Run: scripts/device/run-flows.sh .maestro/flows/budget/calendar.yaml
appId: com.anonymous.moni.e2e
name: B1 budget calendar
tags:
  - b1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: nav.tab.budget
    timeout: 15000
- tapOn:
    id: nav.tab.budget
- tapOn:
    id: budget.view.calendar
- assertVisible:
    id: budget.calendar.day.1
- tapOn:
    id: budget.calendar.day.1
- assertVisible: .* 1 .*
- takeScreenshot: b1-l4-calendar
# A day's "All" link lists that day under Budget, and back returns to the same day. On the pinned
# clock, day 10 is the seed's day with more rows than the card shows.
- tapOn:
    id: budget.calendar.day.10
- scrollUntilVisible:
    element:
      id: budget.day.all
    centerElement: true
- tapOn:
    id: budget.day.all
- assertVisible:
    id: budget.spending.meta
    text: '\d+ payments'
- assertVisible:
    id: budget\.transaction\..*
    index: 0
- takeScreenshot: b1-calendar-day-all
- tapOn:
    id: budget.back
- assertVisible:
    id: budget.day.all
- scrollUntilVisible:
    element:
      id: budget.view.month
    direction: UP
- tapOn:
    id: budget.view.month
- assertVisible:
    id: budget.spend-ring
- assertVisible:
    id: budget.spend-ring.total

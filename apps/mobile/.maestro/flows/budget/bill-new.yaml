# B2 Add a bill (V2P-AmountPage, New bill): Indah Water at RM129, due in a few days, every month.
# Not Unifi fibre, the board's sample: the seed already holds that bill, so the name would edit it.
# Needs at least one MYR wallet and the bills migration pushed.
# Run: scripts/device/run-flows.sh .maestro/flows/budget/bill-new.yaml
appId: com.anonymous.moni.e2e
name: B2 add a bill
tags:
  - b2
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: nav.tab.budget
    timeout: 15000
- tapOn:
    id: nav.tab.budget
- scrollUntilVisible:
    element:
      id: budget.add-bill
    centerElement: true
- tapOn:
    id: budget.add-bill
- assertVisible: New bill
- assertVisible: How much is it each time?
- assertVisible: Add an amount
- tapOn:
    id: budget.key.1
- tapOn:
    id: budget.key.2
- tapOn:
    id: budget.key.9
- assertVisible: RM129.00 every month, on the due date
- tapOn:
    id: budget.bill-new.name
- inputText: Indah Water
- hideKeyboard
- tapOn:
    id: budget.bill-new.due
- assertVisible: Due date
- tapOn:
    id: sheet\.option\..*
    index: 6
- assertVisible: Add bill RM129.00
- takeScreenshot: b2-l6-amount-page
- tapOn:
    id: budget.submit
- assertVisible:
    id: budget.month
- scrollUntilVisible:
    element:
      id: budget.bills.row.indah-water
    centerElement: true
- assertVisible:
    id: budget.bills.row.indah-water
    text: 'Indah Water, RM129\.00, 6 days left.*'
- takeScreenshot: b2-l6-new-bill

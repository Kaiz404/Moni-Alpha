# B1 Ask Moni to suggest a budget (#80, #139): Edit budgets opens Moni chat, which asks which
# budget, then Moni's questions as quick replies; Use this amount puts the suggestion into the
# draft. Nothing is saved.
# Needs Moni's AI on for chat; the e2e build's mock answers with fixed questions.
# Run: scripts/device/run-flows.sh .maestro/flows/budget/suggest.yaml
appId: com.anonymous.moni.e2e
name: B1 ask Moni to suggest a budget
tags:
  - b1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: nav.tab.budget
    timeout: 15000
- tapOn:
    id: nav.tab.budget
- scrollUntilVisible:
    element: Budgets
    centerElement: true
- runFlow:
    when:
      visible:
        id: budget.edit-budgets
    commands:
      - tapOn:
          id: budget.edit-budgets
- runFlow:
    when:
      visible:
        id: budget.set-budgets
    commands:
      - tapOn:
          id: budget.set-budgets
- tapOn:
    id: budget.edit.ask-moni
- extendedWaitUntil:
    visible: Which budget should I suggest?
    timeout: 15000
- takeScreenshot: b1-suggest-pick
- tapOn:
    id: chat.budget.choice.1
- extendedWaitUntil:
    visible: How often do you eat out?
    timeout: 15000
- takeScreenshot: b1-suggest-questions
- tapOn:
    id: chat.budget.choice.0
- extendedWaitUntil:
    visible: What does a meal out usually cost?
    timeout: 15000
- tapOn:
    id: chat.budget.choice.0
- extendedWaitUntil:
    visible:
      id: chat.budget.set
    timeout: 15000
- assertVisible: .* a month
- takeScreenshot: b1-suggest-amount
- tapOn:
    id: chat.budget.set
- assertVisible: Edit budgets
- takeScreenshot: b1-suggest-in-draft

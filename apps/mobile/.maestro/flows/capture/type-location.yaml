# Type it location: the Location field shows the place saved with the entry, and
# a tap opens the place sheet, where No place takes it off this entry and a
# picked spot puts one back. Needs location granted.
# Run: scripts/device/run-flows.sh .maestro/flows/capture/type-location.yaml
appId: com.anonymous.moni.e2e
name: Type it location
tags:
  - y4
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: nav.plus
- tapOn:
    id: nav.chooser.type

# The page works before the location answers.
- tapOn:
    id: capture.key.7
- assertVisible: −RM7

- extendedWaitUntil:
    visible:
      id: capture.location
    timeout: 15000
- takeScreenshot: y4-location-on

# The sheet opens with search, the map with its my-location button, and the list.
- tapOn:
    id: capture.location
- assertVisible: Choose a place
- assertVisible:
    id: sheet.place.search
- assertVisible:
    id: sheet.place.my-location
- assertVisible:
    id: sheet.place.confirm
- takeScreenshot: y4-location-sheet
- tapOn:
    id: sheet.place.off
- assertVisible: Not saved
- takeScreenshot: y4-location-off

# Confirm puts the spot back.
- tapOn:
    id: capture.location
- tapOn:
    id: sheet.place.confirm
- assertNotVisible: Not saved
- pressKey: Back

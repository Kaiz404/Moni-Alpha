# C2 Scan a receipt: the ML Kit scanner imports the mamak receipt from the
# gallery, Moni reads it, the check page approves it to the ledger.
# The e2e mock reads any scanned image as this receipt (lib/ai/client/mock-fixtures.ts).
# run-flows.sh pushes .maestro/fixtures/*.png to /sdcard/Pictures/moni-e2e/ for the import.
# The scanner's import control is Google's UI; its label is the Appendix A
# experiment's finding and may need updating after `maestro hierarchy`.
# needs-scanner: the picker shows no filenames and displays the phone's real gallery, so default runs
# skip this flow and no screenshot is taken while the picker is up.
# Run: scripts/device/run-flows.sh --tag needs-scanner .maestro/flows/capture/scan.yaml
appId: com.anonymous.moni.e2e
name: C2 Scan a receipt
tags:
  - c2
  - needs-scanner
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: nav.plus
- tapOn:
    id: nav.chooser.scan

# Google's scanner: import the fixture, accept the page.
- extendedWaitUntil:
    visible:
      text: (?i).*import.*
    timeout: 10000
- tapOn:
    text: (?i).*import.*
- tapOn:
    text: receipt-mamak.png
- tapOn:
    text: (?i)(save|done)

# Reading, then the result card.
- extendedWaitUntil:
    visible: Check and approve
    timeout: 20000
- assertVisible:
    id: capture.result.amount
- assertVisible:
    id: capture.result.category
- assertVisible:
    id: capture.result.wallet
- assertVisible:
    id: capture.location
- assertVisible:
    id: capture.shop
- assertVisible:
    id: capture.evidence
- assertVisible: Receipt · 3 items
- assertVisible: Moni read 3 items and a total of RM15.30.*
- takeScreenshot: c2-l2-pair

# Edit the amount in place before approving.
- tapOn:
    id: capture.amount.edit
- eraseText: 10
- inputText: '16.30'
- tapOn:
    id: capture.amount.save
- assertVisible: −RM16.30
- takeScreenshot: c2-l5-edit

- tapOn:
    id: capture.approve
- assertVisible: It counts in your totals now.
- assertVisible: .*· 3 items
- assertVisible:
    id: capture.added.home
- assertVisible:
    id: capture.added.another
- takeScreenshot: c2-l3-added
- tapOn:
    id: capture.added.home
- assertVisible:
    id: home.avatar

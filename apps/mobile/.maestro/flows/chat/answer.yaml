# H2 answer card: a Transport question shows the thinking card, then an answer card with ledger numbers.
# Needs Transport spending this month in the main currency.
# Run: scripts/device/run-flows.sh .maestro/flows/chat/answer.yaml
appId: com.anonymous.moni.e2e
name: H2 chat answer
tags:
  - h2
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: home.ask-box
    timeout: 15000
- tapOn:
    id: home.ask-box
- tapOn:
    id: chat.input
- inputText: How much on Transport this month
- tapOn:
    id: chat.send
# The thread follows the answer's end, and the card with its chart is taller than the space above
# the keyboard, so its title shows once the keyboard is down.
- extendedWaitUntil:
    visible:
      id: chat.answer.open-budget
    timeout: 30000
- hideKeyboard
- scrollUntilVisible:
    element:
      id: chat.answer.title
    direction: UP
- assertVisible:
    id: chat.answer.title
    text: 'RM.* on Transport.*'
- assertVisible:
    id: chat.answer.open-budget
- takeScreenshot: h2-l4-answer

# The composer still works after an answer, and the keyboard keeps the thread's end above it.
- tapOn:
    id: chat.input
- assertVisible:
    id: chat.answer.open-budget
- takeScreenshot: h2-l10-keyboard
- hideKeyboard
- assertVisible:
    id: chat.mic

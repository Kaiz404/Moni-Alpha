# H2 past days: today's thread is listed, search finds it, and a delete shows Undo.
# It sends the parking sentence itself, so today's thread mentions parking.
# Run: scripts/device/run-flows.sh .maestro/flows/chat/history.yaml
appId: com.anonymous.moni.e2e
name: H2 chat history
tags:
  - h2
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: home.ask-box
    timeout: 15000
- tapOn:
    id: home.ask-box
- tapOn:
    id: chat.input
- inputText: paid 6 ringgit parking at KLCC
- tapOn:
    id: chat.send
- extendedWaitUntil:
    visible:
      id: chat.draft.approve
    timeout: 30000
- tapOn:
    id: chat.history
- assertVisible: Past days
- tapOn:
    id: chat.history.search
- inputText: parking
- assertVisible: Today
- takeScreenshot: h2-l6-history
- hideKeyboard

# Delete today's thread, then Undo.
- tapOn:
    id: chat.history.edit
- tapOn:
    id: 'chat\.history\.delete\..*'
- assertVisible: Today deleted
- tapOn: Undo
- assertVisible: Today

# A day opens its thread.
- tapOn:
    id: chat.history.edit
- tapOn:
    id: 'chat\.history\.day\..*'
- assertVisible:
    id: chat.input

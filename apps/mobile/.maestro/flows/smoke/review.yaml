# Smoke: Home's review block opens the Review deck on a seeded capture. Nothing is decided.
# Run: scripts/device/run-flows.sh --tag smoke
appId: com.anonymous.moni.e2e
name: Smoke Review deck
tags:
  - smoke
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- scrollUntilVisible:
    element:
      id: home.review
    centerElement: true
- tapOn:
    id: home.review
- extendedWaitUntil:
    visible:
      id: review.card
    timeout: 10000
- assertVisible:
    id: review.summary
- assertVisible: Not mine
- assertNotVisible: Later
- assertVisible: Approve
- takeScreenshot: smoke-review
# Back lands on Home where it was. The wallet strip made Home taller, so the avatar is above the screen.
- pressKey: Back
- assertVisible:
    id: home.review
- assertNotVisible:
    id: review.card

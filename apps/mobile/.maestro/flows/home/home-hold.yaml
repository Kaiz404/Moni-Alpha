# X1 Home Recent rows share Activity's hold menu: hold a row, see the three actions, close it.
# Needs spending in the main currency.
# Run: scripts/device/run-flows.sh .maestro/flows/home/home-hold.yaml
appId: com.anonymous.moni.e2e
name: X1 Home hold menu
tags:
  - x1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- scrollUntilVisible:
    element:
      id: 'home\.recent\.row\..*'
- longPressOn:
    id: 'home\.recent\.row\..*'
    index: 0
- assertVisible:
    id: home.hold.edit-category
- assertVisible: Change wallet
- assertVisible: Delete
- takeScreenshot: x1-home-hold-menu
- tapOn:
    id: home.hold.close
- assertNotVisible:
    id: home.hold.edit-category

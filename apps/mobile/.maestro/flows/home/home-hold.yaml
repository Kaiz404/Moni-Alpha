# X1 Home Recent rows share Activity's hold menu: hold a row, see the three actions, close it.
# Needs a signed-in e2e build with spending in the main currency.
# Run: scripts/device/with-device.sh --lane x1 -- maestro test .maestro/flows/home/home-hold.yaml
appId: com.anonymous.moni.e2e
name: X1 Home hold menu
tags:
  - x1
  - needs-default-seed
---
- launchApp
- extendedWaitUntil:
    visible:
      id: home.avatar
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'home\.recent\.row\..*'
- longPressOn:
    id: 'home\.recent\.row\..*'
    index: 0
- assertVisible:
    id: home.hold.edit-category
- assertVisible: Change wallet
- assertVisible: Delete
- takeScreenshot: x1-home-hold-menu
- tapOn:
    id: home.hold.close
- assertNotVisible:
    id: home.hold.edit-category

# H1 Home: every V2H-Home block in order, then Wallets from Net worth.
# Needs at least one main-currency wallet and spending.
# Run: scripts/device/run-flows.sh .maestro/flows/home/home.yaml
appId: com.anonymous.moni.e2e
name: H1 Home blocks
tags:
  - h1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- assertVisible:
    id: home.ask-moni
- assertVisible:
    id: home.net-worth.amount
- assertVisible:
    id: home.chart.callout
- assertVisible:
    id: home.chart.pace
- assertVisible:
    id: home.chart.plot
- assertVisible:
    id: home.ask-box
- takeScreenshot: h1-l1-home
- scrollUntilVisible:
    element:
      text: Recent
- takeScreenshot: h1-l1-home-recent

# Toggle Daily and back.
- scrollUntilVisible:
    element:
      id: home.chart.daily
    direction: UP
- tapOn:
    id: home.chart.daily
- assertVisible:
    id: home.chart.even-pace
- takeScreenshot: h1-l4-daily
- tapOn:
    id: home.chart.pace
- assertNotVisible:
    id: home.chart.even-pace

# Net worth opens Wallets.
- tapOn:
    id: home.net-worth
- assertVisible:
    id: wallet.list.net-worth
- assertVisible: Wallets
- takeScreenshot: h1-l3-wallets

# The net worth chart: range chips, one line per wallet, and a scrub that reads a past day.
- assertVisible:
    id: wallet.chart.plot
- tapOn:
    id: wallet.chart.30d
- assertVisible:
    id: wallet.chart.callout
- tapOn:
    id: wallet.chart.90d
- assertVisible:
    id: wallet.chart.callout
- tapOn:
    id: wallet.chart.by-wallet
- assertVisible:
    id: wallet.chart.key
- takeScreenshot: h1-l3-wallets-by-wallet
- swipe:
    from:
      id: wallet.chart.plot
    direction: LEFT
    duration: 1200
- assertVisible:
    text: '(Mon|Tue|Wed|Thu|Fri|Sat|Sun) \d{1,2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)( \d{4})?'
- tapOn:
    id: wallet.chart.total
- assertNotVisible:
    id: wallet.chart.key
- tapOn:
    id: wallet.back
- assertVisible:
    id: home.avatar

# The ask box opens Moni chat.
- tapOn:
    id: home.ask-box
- assertVisible:
    id: chat.back
- tapOn:
    id: chat.back
- assertVisible:
    id: home.avatar

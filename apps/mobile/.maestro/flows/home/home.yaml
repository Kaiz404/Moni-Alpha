# H1 Home: every V2H-Home block in order, then Wallets from Net worth.
# Needs at least one main-currency wallet and spending.
# Run: scripts/device/run-flows.sh .maestro/flows/home/home.yaml
appId: com.anonymous.moni.e2e
name: H1 Home blocks
tags:
  - h1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- assertVisible:
    id: home.ask-moni
- assertVisible:
    id: home.net-worth.amount
# At rest a chart shows only its marks; the callout shows only under a finger (Jest covers the scrub).
- assertNotVisible:
    id: home.chart.callout
- assertVisible:
    id: home.chart.pace
- assertVisible:
    id: home.chart.plot
- assertVisible:
    id: home.ask-box
- takeScreenshot: h1-l1-home
- scrollUntilVisible:
    element:
      text: Recent
- takeScreenshot: h1-l1-home-recent

# Toggle Daily and back.
- scrollUntilVisible:
    element:
      id: home.chart.daily
    direction: UP
- tapOn:
    id: home.chart.daily
- assertVisible:
    id: home.chart.even-pace
- takeScreenshot: h1-l4-daily
- tapOn:
    id: home.chart.pace
- assertNotVisible:
    id: home.chart.even-pace

# Net worth opens Wallets.
- tapOn:
    id: home.net-worth
- assertVisible:
    id: wallet.list.net-worth
- assertVisible: Wallets
- takeScreenshot: h1-l3-wallets

# The net worth chart: range chips and one line per wallet, with no callout at rest.
- assertVisible:
    id: wallet.chart.plot
- tapOn:
    id: wallet.chart.30d
- assertNotVisible:
    id: wallet.chart.callout
- tapOn:
    id: wallet.chart.90d
- assertNotVisible:
    id: wallet.chart.callout
# By wallet draws one line per wallet in its list tint, with no key.
- tapOn:
    id: wallet.chart.by-wallet
- assertVisible:
    id: wallet.chart.plot
- takeScreenshot: h1-l3-wallets-by-wallet
# A scrub leaves nothing behind once the finger lifts.
- swipe:
    from:
      id: wallet.chart.plot
    direction: LEFT
    duration: 1200
- assertNotVisible:
    id: wallet.chart.callout
- tapOn:
    id: wallet.chart.total
- tapOn:
    id: wallet.back
- assertVisible:
    id: home.avatar

# The ask box opens Moni chat.
- tapOn:
    id: home.ask-box
- assertVisible:
    id: chat.back
- tapOn:
    id: chat.back
- assertVisible:
    id: home.avatar

# H1 Home scrub: drag across the Pace chart; the callout follows a day.
# Run: scripts/device/run-flows.sh .maestro/flows/home/home-scrub.yaml
appId: com.anonymous.moni.e2e
name: H1 Home scrub
tags:
  - h1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: home.chart.plot
    timeout: 15000
- assertVisible:
    id: home.chart.callout
- assertVisible: By today
- swipe:
    from:
      id: home.chart.plot
    direction: LEFT
    duration: 1200
- assertVisible:
    id: home.chart.callout
# The callout always shows a day. Only leaving "By today" proves the chart took the drag.
- assertNotVisible: By today
- assertVisible:
    text: 'By \d+ .*'
- takeScreenshot: h1-l5-scrub
- tapOn:
    id: home.chart.plot
    point: 20%,50%
- assertNotVisible: By today
- assertVisible:
    text: 'By \d+ .*'

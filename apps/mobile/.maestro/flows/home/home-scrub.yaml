# H1 Home scrub: the spent chart shows only its marks at rest, and a drag or a tap leaves nothing
# behind once the finger lifts. Maestro cannot hold a finger and assert at once, so what the
# callout reads under the finger, its snapping and its haptics live in Jest
# (components/home/__tests__/spent-card.test.tsx).
# Run: scripts/device/run-flows.sh .maestro/flows/home/home-scrub.yaml
appId: com.anonymous.moni.e2e
name: H1 Home scrub
tags:
  - h1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- extendedWaitUntil:
    visible:
      id: home.chart.plot
    timeout: 15000
- assertNotVisible:
    id: home.chart.callout
- assertNotVisible: By today
- swipe:
    from:
      id: home.chart.plot
    direction: LEFT
    duration: 1200
- assertNotVisible:
    id: home.chart.callout
- takeScreenshot: h1-l5-scrub-released
- tapOn:
    id: home.chart.plot
    point: 20%,50%
- assertNotVisible:
    id: home.chart.callout

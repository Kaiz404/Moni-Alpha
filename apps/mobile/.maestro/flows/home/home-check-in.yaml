# H1 Home check-in: That's right, then Undo; Not now, then Undo.
# Needs a main-currency wallet unchecked for 30 days with enough history.
# Run: scripts/device/run-flows.sh .maestro/flows/home/home-check-in.yaml
appId: com.anonymous.moni.e2e
name: H1 Home check-in
tags:
  - h1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- scrollUntilVisible:
    element:
      id: home.check-in.right
- takeScreenshot: h1-l7-check-in
- tapOn:
    id: home.check-in.right
- assertVisible:
    text: '.*Thanks for checking.'
- tapOn:
    id: home.check-in.undo
- assertVisible:
    id: home.check-in.not-now
- tapOn:
    id: home.check-in.not-now
- assertVisible:
    text: 'Moni will ask about .* again next week.'
- tapOn:
    id: home.check-in.undo
- assertVisible:
    id: home.check-in.right

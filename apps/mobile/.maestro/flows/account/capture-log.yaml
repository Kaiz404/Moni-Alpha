# K3 Capture log: day groups, filter chips, glossary statuses, and the empty state.
# Post alerts first for the filled log; with none it checks the empty state.
# Run: scripts/device/run-flows.sh .maestro/flows/account/capture-log.yaml
appId: com.anonymous.moni.e2e
name: K3 capture log
tags:
  - k3
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: home.avatar
- scrollUntilVisible:
    element:
      id: profile.row.capture-log
- tapOn:
    id: profile.row.capture-log
- assertVisible: Capture log
- assertNotVisible: Queued
- assertNotVisible: Queued for review

# A filled log: All plus one chip per status present.
- runFlow:
    when:
      visible:
        id: capture-log.filter.all
    commands:
      - takeScreenshot: k3-l1-log
      - runFlow:
          when:
            visible:
              id: capture-log.filter.waiting-for-review
          commands:
            - tapOn:
                id: capture-log.filter.waiting-for-review
            - assertVisible: Review it
            - takeScreenshot: k3-l3-filter
            - tapOn:
                id: capture-log.filter.all
      - runFlow:
          when:
            visible:
              id: capture-log.show-older
          commands:
            - tapOn:
                id: capture-log.show-older
            - assertNotVisible:
                id: capture-log.show-older
      # Removing one alert offers Undo; Clear all asks first and Keep it leaves the log alone.
      - tapOn:
          id: 'capture-log\.entry\..*\.dismiss'
          index: 0
      - assertVisible: Alert removed
      - takeScreenshot: p1-dismiss-undo
      - tapOn:
          id: nav.toast.undo
      - tapOn:
          id: capture-log.clear-all
      - assertVisible: Clear the Capture log?
      - assertVisible: '.*Transactions and captures waiting for review stay as they are.*'
      - takeScreenshot: p1-clear-all
      - tapOn:
          id: sheet.cancel
      - assertVisible:
          id: capture-log.filter.all

# The empty log explains each status and points at notification access.
- runFlow:
    when:
      visible:
        id: capture-log.check-access
    commands:
      - assertVisible: Nothing captured yet
      - assertVisible: What each status means
      - takeScreenshot: k3-l4-empty
      - tapOn:
          id: capture-log.check-access
      - assertVisible: Capture sources
      - tapOn:
          id: sources.back

- tapOn:
    id: capture-log.back

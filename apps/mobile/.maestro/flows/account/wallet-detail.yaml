# K2 wallet page: its blocks, rename in place with Undo, Edit wallet, and Delete wallet.
# Creates "K2 Detail", renames it, and deletes it at the end.
# Opens the form and the wallet from Home, Net worth, then Wallets.
# Undo goes straight after the rename: the toast lasts 5 s and a Maestro tap takes about as long.
# Run: scripts/device/run-flows.sh .maestro/flows/account/wallet-detail.yaml
appId: com.anonymous.moni.e2e
name: K2 wallet page
tags:
  - k2
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: home.net-worth
- tapOn:
    id: wallet.list.add
- tapOn:
    id: wallet.form.name
- inputText: K2 Detail
- tapOn:
    id: wallet.form.starting-balance
- inputText: '120.00'
- hideKeyboard
- tapOn:
    id: wallet.form.submit
- scrollUntilVisible:
    element:
      text: K2 Detail
    centerElement: true
- tapOn: K2 Detail

# Lane 2. The blocks in board order.
- extendedWaitUntil:
    visible:
      id: wallet.balance.edit
    timeout: 10000
- assertVisible:
    id: wallet.back
- assertVisible:
    id: wallet.more
- assertVisible:
    id: wallet.name.edit
- assertVisible: RM120.00
- assertVisible:
    id: wallet.balance-not-right
- assertVisible: Checked today
- assertVisible: 'Same as on 1 .*'
- assertVisible: Transactions
- scrollUntilVisible:
    element:
      id: wallet.capture-log
- assertVisible:
    id: wallet.alerts
- scrollUntilVisible:
    element:
      id: wallet.default
- assertVisible: Use as default
- takeScreenshot: k2-l2-pair
- scrollUntilVisible:
    element:
      id: wallet.name.edit
    direction: UP

# Lane 4. Rename in place and Undo, then rename again.
- tapOn:
    id: wallet.name.edit
- assertVisible: Only the name changes. Its transactions stay as they are.
- eraseText: 20
- inputText: K2 Undone
- tapOn:
    id: wallet.name.save
- tapOn:
    id: nav.toast.undo
- assertVisible: K2 Detail
- assertNotVisible: K2 Undone
- tapOn:
    id: wallet.name.edit
- eraseText: 20
- inputText: K2 Renamed
- tapOn:
    id: wallet.name.save
- assertVisible: Renamed to K2 Renamed
- takeScreenshot: k2-l4-rename

# Edit wallet opens the form with the currency locked.
- tapOn:
    id: wallet.more
- tapOn:
    id: wallet.menu.edit
- assertVisible: Edit wallet
- assertVisible: Save changes
- assertVisible:
    id: wallet.form.delete
- takeScreenshot: k2-form-edit
- tapOn:
    id: wallet.back
- assertVisible:
    id: wallet.balance.edit

# Lane 8. Delete through the confirm sheet; the page closes.
- tapOn:
    id: wallet.more
- tapOn:
    id: wallet.menu.delete
- assertVisible: Delete K2 Renamed?
- takeScreenshot: k2-l8-delete
- tapOn:
    id: sheet.confirm
- assertNotVisible:
    id: wallet.balance.edit
- assertVisible: Wallets
- assertNotVisible: K2 Renamed

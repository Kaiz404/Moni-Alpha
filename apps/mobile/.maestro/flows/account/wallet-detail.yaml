# K2 wallet page: balance, chart and transactions only; Edit wallet renames it, holds Alerts and
# Use as default, and deletes it from the header trash button.
# Creates "K2 Detail", renames it, and deletes it at the end.
# Opens the form and the wallet from Home, Net worth, then Wallets.
# Run: scripts/device/run-flows.sh .maestro/flows/account/wallet-detail.yaml
appId: com.anonymous.moni.e2e
name: K2 wallet page
tags:
  - k2
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: home.net-worth
- tapOn:
    id: wallet.list.add
- tapOn:
    id: wallet.form.name
- inputText: K2 Detail
- tapOn:
    id: wallet.form.starting-balance
- inputText: '120.00'
- hideKeyboard
- tapOn:
    id: wallet.form.submit
- scrollUntilVisible:
    element:
      text: K2 Detail
    centerElement: true
- tapOn: K2 Detail

# Lane 2. The blocks in board order. The name does not edit here, and the settings live on Edit wallet.
- extendedWaitUntil:
    visible:
      id: wallet.balance.edit
    timeout: 10000
- assertVisible:
    id: wallet.back
- assertVisible:
    id: wallet.more
- assertVisible:
    id: wallet.name
- assertNotVisible:
    id: wallet.name.edit
- assertVisible: RM120.00
- assertNotVisible: Checked today
# A wallet made today has no history before today, so the chart's headline counts from today.
- assertVisible: 'No change since .*'
- assertVisible: Transactions
- assertNotVisible: Use as default
- takeScreenshot: k2-l2-pair

# Edit wallet: the currency locked, Alerts and Use as default, and the trash button in the header.
- tapOn:
    id: wallet.more
- tapOn:
    id: wallet.menu.edit
- assertVisible: Edit wallet
- assertVisible: Save changes
- assertVisible:
    id: wallet.form.delete
- scrollUntilVisible:
    element:
      id: wallet.default
- assertVisible:
    id: wallet.alerts
- assertVisible: Use as default
- takeScreenshot: k2-form-edit

# Lane 4. Rename on Edit wallet.
- scrollUntilVisible:
    element:
      id: wallet.form.name
    direction: UP
- tapOn:
    id: wallet.form.name
- eraseText: 20
- inputText: K2 Renamed
- hideKeyboard
- tapOn:
    id: wallet.form.submit
- assertVisible: K2 Renamed
- takeScreenshot: k2-l4-rename

# Lane 8. Delete from Edit wallet's trash button through the confirm sheet; both pages close.
- tapOn:
    id: wallet.more
- tapOn:
    id: wallet.menu.edit
- tapOn:
    id: wallet.form.delete
- assertVisible: Delete K2 Renamed?
- takeScreenshot: k2-l8-delete
- tapOn:
    id: sheet.confirm
- assertNotVisible:
    id: wallet.balance.edit
# Wallets keeps the scroll that reached the wallet, so its scrolling header sits above the screen.
- scrollUntilVisible:
    element:
      id: wallet.list.add
    direction: UP
- assertVisible: Wallets
- assertNotVisible: K2 Renamed

# Y1 capture trust: the Home alert, Linked apps with Last captured, Keep capture running, the
# one-sentence promise, and reporting a missed transaction into a prefilled Type it.
# The seed cannot write the capture log or capture health (both live on the phone), so a real
# quiet source needs days of history: the Home alert step runs only when the phone has one.
# Run: scripts/device/run-flows.sh .maestro/flows/account/capture-trust.yaml
appId: com.anonymous.moni.e2e
name: Y1 capture trust
tags:
  - y1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml

- runFlow:
    when:
      visible:
        id: home.capture-alert.fix
    commands:
      - takeScreenshot: y1-home-alert
      - assertVisible:
          id: home.capture-alert.dismiss

- tapOn:
    id: home.avatar
- scrollUntilVisible:
    element:
      id: profile.row.bank-notifications
- tapOn:
    id: profile.row.bank-notifications
- assertVisible: Capture sources
- assertVisible: .*One-time codes never leave this phone.*
- takeScreenshot: y1-sources

- scrollUntilVisible:
    element:
      text: Keep capture running
- assertVisible:
    id: sources.battery
- takeScreenshot: y1-keep-running

# Maybank is linked in seed-full.
- scrollUntilVisible:
    element:
      id: sources.app.maybank.report-missed
- assertVisible: Linked apps
- assertVisible: (No captures yet|Last captured .*)
- takeScreenshot: y1-linked-apps
- tapOn:
    id: sources.app.maybank.report-missed
- assertVisible: New expense
- takeScreenshot: y1-type-it-from-source
- back

- scrollUntilVisible:
    element:
      id: sources.capture-log
- tapOn:
    id: sources.capture-log
- assertVisible: Capture log
- assertVisible:
    id: capture-log.report-missed
- takeScreenshot: y1-log-report

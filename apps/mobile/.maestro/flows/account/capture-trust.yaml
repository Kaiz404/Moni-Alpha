# Y1 capture trust: the Home alert, Keep capture running, and the one-sentence promise.
# wallet-linked-app.yaml reports a missed transaction from the wallet page.
# The seed cannot write capture health (it lives on the phone), so a real
# quiet source needs days of history: the Home alert step runs only when the phone has one.
# Run: scripts/device/run-flows.sh .maestro/flows/account/capture-trust.yaml
appId: com.anonymous.moni.e2e
name: Y1 capture trust
tags:
  - y1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml

- runFlow:
    when:
      visible:
        id: home.capture-alert.fix
    commands:
      - takeScreenshot: y1-home-alert
      - assertVisible:
          id: home.capture-alert.dismiss

- tapOn:
    id: home.avatar
- scrollUntilVisible:
    element:
      id: profile.row.capture-sources
- tapOn:
    id: profile.row.capture-sources
- assertVisible: Capture sources
- assertVisible: .*One-time codes never leave this phone.*
- takeScreenshot: y1-sources

- scrollUntilVisible:
    element:
      text: Keep capture running
- assertVisible:
    id: sources.battery
- takeScreenshot: y1-keep-running

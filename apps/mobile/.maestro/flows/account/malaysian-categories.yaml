# Y2 presets: Transit and Tolls list before Other Expenses. TNG Reloads, PTPTN and Takaful are retired
# (20261116000000_remove_reload_ptptn_takaful_presets.sql) and must not list.
# Run: scripts/device/run-flows.sh .maestro/flows/account/malaysian-categories.yaml
appId: com.anonymous.moni.e2e
name: Y2 Malaysian categories
tags:
  - y2
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- openLink: moni-e2e://categories
- extendedWaitUntil:
    visible: Categories
    timeout: 10000
- scrollUntilVisible:
    element: Transit
    direction: DOWN
- assertVisible: Tolls
- takeScreenshot: y2-categories-transit-tolls
- scrollUntilVisible:
    element: Other Expenses
    direction: DOWN
- assertNotVisible: Takaful
- assertNotVisible: TNG Reloads
- assertNotVisible: PTPTN

# Create account asks for the birth month and year, and turns away anyone under 18 without making an account.
# Starts signed out. Ends signed in: the relaunch empties the form, then launch.yaml signs in.
# Run: scripts/device/run-flows.sh .maestro/flows/account/sign-up-age.yaml
appId: com.anonymous.moni.e2e
name: Sign-up age check
tags:
  - seed-any
---
- runFlow: ../../subflows/launch.yaml
- runFlow: ../../subflows/sign-out.yaml
- extendedWaitUntil:
    visible:
      id: auth.email
    timeout: 15000
- tapOn:
    id: auth.mode.create-account
- assertVisible: Create your Moni account
- assertVisible: Moni is for people 18 and over. We keep only the month and year.

- tapOn:
    id: auth.birth.month
- assertVisible: Birth month
- tapOn:
    id: sheet.option.4
- tapOn:
    id: auth.birth.year
- assertVisible: Birth year
- assertVisible: 2000s
- takeScreenshot: sign-up-age-year-grid
- tapOn:
    id: sheet.page.next
- assertVisible: 2010s
- tapOn:
    id: sheet.option.2010
- assertVisible: Apr
- assertVisible: '2010'
- takeScreenshot: sign-up-age-picked

# Once the e2e sign-in is saved, Email gaining focus opens Google's "Use your saved password" dialog.
# It takes the keys typed next and the Back that would hide the keyboard, so answer it as a user does.
# The keyboard's Next key moves between fields, so no tap lands under the open keyboard.
- tapOn:
    id: auth.name
- inputText: Young Kai
- pressKey: Enter
- tapOn:
    text: No thanks
    optional: true
- assertVisible:
    id: auth.email
    focused: true
- inputText: under-age-e2e@example.com
- assertVisible: under-age-e2e@example.com
- pressKey: Enter
- assertVisible:
    id: auth.password
    focused: true
- inputText: long-enough-1
- takeScreenshot: sign-up-age-form

# Go on the password keyboard submits the form, the same as the Create account button.
- pressKey: Enter
- extendedWaitUntil:
    visible: "Moni is for people 18 and over, so we can't create an account for you."
    timeout: 5000
- assertVisible:
    id: auth.create-account
- takeScreenshot: sign-up-age-under-18

- runFlow: ../../subflows/launch.yaml

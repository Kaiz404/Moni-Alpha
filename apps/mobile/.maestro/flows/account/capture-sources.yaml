# K3 Capture sources: one Notifications row with no app named, phone access, rules added without
# asking, links. The Ask again step runs when a GRAB auto-add rule exists.
# Ask again is undone at the end so the flow can run twice; lane 7 skips the Undo.
# Run: scripts/device/run-flows.sh .maestro/flows/account/capture-sources.yaml
appId: com.anonymous.moni.e2e
name: K3 capture sources
tags:
  - k3
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: home.avatar
- scrollUntilVisible:
    element:
      id: profile.row.capture-sources
- tapOn:
    id: profile.row.capture-sources
- assertVisible:
    id: sources.back
- assertVisible: Capture sources
- assertNotVisible: Moni works without any of these.*
- assertVisible:
    id: sources.location
- assertVisible:
    id: sources.camera
- assertVisible:
    id: sources.microphone
- assertNotVisible: Bank notifications
- assertNotVisible: Maybank
# Maybank is linked in seed-full, so the pointer to the wallet pages stays away.
- assertNotVisible:
    id: sources.link-app
- takeScreenshot: k3-l9-sources

# Notification access on: the one row says what it reads and names no app.
- runFlow:
    when:
      visible:
        id: sources.notifications
    commands:
      - assertVisible: .*Reads alerts from the apps you link on your wallets

# Notification access revoked: the denied state replaces the row.
- runFlow:
    when:
      visible:
        id: sources.notifications.open-settings
    commands:
      - assertVisible: Moni can't see notifications
      - assertVisible: .*One-time codes never leave this phone.*
      - assertVisible:
          id: sources.notifications.by-hand
      - takeScreenshot: k3-l10-denied

# Ask again on the GRAB rule, then Undo.
- scrollUntilVisible:
    element:
      text: Added without asking
- runFlow:
    when:
      visible:
        id: sources.rule.grab.ask-again
    commands:
      - tapOn:
          id: sources.rule.grab.ask-again
      - assertVisible: Moni will ask about .* again
      - takeScreenshot: k3-l7-ask-again
      - tapOn:
          id: nav.toast.undo
      - assertVisible:
          id: sources.rule.grab.ask-again

- scrollUntilVisible:
    element:
      id: sources.capture-log
- tapOn:
    id: sources.capture-log
- assertVisible: Capture log
- tapOn:
    id: capture-log.back
- assertNotVisible: Linked apps
# The header scrolls away with the page, so bring it back before going back.
- scrollUntilVisible:
    element:
      id: sources.back
    direction: UP
- tapOn:
    id: sources.back

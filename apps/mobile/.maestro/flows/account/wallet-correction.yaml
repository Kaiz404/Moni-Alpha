# K2 balance correction: RM63.60 to RM60.00 writes a −RM3.60 correction, and Undo removes it.
# Creates a "K2 Fix" cash wallet and leaves it corrected to RM60.00.
# Opens the form and the wallet from Home, Net worth, then Wallets.
# Undo goes straight after the save: a Maestro tap takes about 6 s, so a flow-run build holds the toast for 15 s (EXPO_PUBLIC_E2E_TOAST_MS).
# Run: scripts/device/run-flows.sh .maestro/flows/account/wallet-correction.yaml
appId: com.anonymous.moni.e2e
name: K2 balance correction
tags:
  - k2
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: home.net-worth
- tapOn:
    id: wallet.list.add
- tapOn:
    id: wallet.form.name
- inputText: K2 Fix
- tapOn:
    id: wallet.type
- tapOn:
    id: sheet.option.cash
- tapOn:
    id: wallet.form.starting-balance
- inputText: '63.60'
- hideKeyboard
- tapOn:
    id: wallet.form.submit
- scrollUntilVisible:
    element:
      text: K2 Fix
    centerElement: true
- tapOn: K2 Fix
- extendedWaitUntil:
    visible:
      id: wallet.balance.edit
    timeout: 10000
- assertVisible: RM63.60

# The pencil opens the balance sheet. A matching balance writes nothing.
- tapOn:
    id: wallet.balance.edit
- assertVisible: Edit Amount
- assertVisible:
    id: wallet.balance-sheet.input
- assertVisible: Adds a balance correction transaction for the difference.
- inputText: '63.60'
- tapOn:
    id: wallet.balance-sheet.save
- assertVisible: Balance checked
- assertNotVisible: Balance correction

# The pencil opens the sheet again. A different balance writes the correction.
- tapOn:
    id: wallet.balance.edit
- assertVisible:
    id: wallet.balance-sheet.input
- inputText: '60'
- takeScreenshot: k2-correction-typing
# The toast's countdown bar keeps the screen moving, so Maestro's default wait for it to settle
# would spend most of the toast before Undo.
- tapOn:
    id: wallet.balance-sheet.save
    waitToSettleTimeoutMs: 1000

# Lane 3. Undo removes the row and the balance returns.
- tapOn:
    id: nav.toast.undo
- assertNotVisible: Balance correction
- assertVisible: RM63.60
- takeScreenshot: k2-l3-undo

# Lane 1 and You see. Saved again, the balance reads RM60.00, the row and the toast appear.
- tapOn:
    id: wallet.balance.edit
- inputText: '60'
- tapOn:
    id: wallet.balance-sheet.save
- assertVisible: Correction −RM3.60 added
- assertVisible: RM60.00
- assertVisible: Balance correction
- assertVisible: Not in budgets, K2 Fix
- takeScreenshot: k2-l1-corrected

# M1 empty map (XM-Empty): no places yet, or location off.
# Needs no located expenses (the empty seed).
# Run: scripts/device/run-flows.sh .maestro/flows/map/map-empty.yaml
appId: com.anonymous.moni.e2e
name: M1 map empty
tags:
  - m1
  - seed-empty
---
- runFlow: ../../subflows/launch.yaml
- openLink: moni-e2e://map
- extendedWaitUntil:
    visible: Where you spend
    timeout: 10000
- assertVisible:
    id: map.empty.past-expense
- runFlow:
    when:
      visible:
        id: map.empty.add-expense
    commands:
      - assertVisible: No places yet
      - takeScreenshot: m1-l8-empty
- runFlow:
    when:
      visible:
        id: map.empty.turn-on-location
    commands:
      - assertVisible: You turned off location
      - takeScreenshot: m1-l9-location-off

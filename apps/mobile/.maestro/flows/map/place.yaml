# M1 place page: See this place, the payments, and See these in Activity.
# Needs located expenses this month.
# Run: scripts/device/run-flows.sh .maestro/flows/map/place.yaml
appId: com.anonymous.moni.e2e
name: M1 place
tags:
  - m1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- openLink: moni-e2e://map
- extendedWaitUntil:
    visible:
      id: map.place-card.open
    timeout: 10000
- tapOn:
    id: map.place-card.open
- extendedWaitUntil:
    visible:
      id: map.place.back
    timeout: 5000
- assertVisible:
    id: map.place.directions
- assertVisible: What you bought
- takeScreenshot: m1-l5-place
- scrollUntilVisible:
    element:
      id: map.place.see-all
- assertVisible: Payments
- assertVisible: Newest first
# See all pushes the place's list under the place page; Back returns to it.
- tapOn:
    id: map.place.see-all
- extendedWaitUntil:
    visible:
      id: list.back
    timeout: 5000
- assertVisible: '\d+ transactions?'
- takeScreenshot: m1-l6-list
- tapOn:
    id: list.back
- assertVisible:
    id: map.place.see-all

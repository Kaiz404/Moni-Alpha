# A1 search: typing grab leaves only Grab rows; a miss shows the no-matches tile.
# Run: scripts/device/run-flows.sh .maestro/flows/activity/activity-search.yaml
appId: com.anonymous.moni.e2e
name: A1 Activity search
tags:
  - a1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: nav.tab.activity
- extendedWaitUntil:
    visible:
      id: activity.search
    timeout: 15000
- assertVisible: 'Spent in .*'
- tapOn:
    id: activity.search
# The bar scrolls to the top, past the chart, so the keyboard leaves room for results.
- assertNotVisible: 'Spent in .*'
- inputText: grab
- hideKeyboard
- assertVisible: '(?i)grab.*'
- assertNotVisible: 'Shell'
- assertNotVisible: 'Kopitiam'
- takeScreenshot: a1-search-grab
- tapOn:
    id: activity.search.clear
- inputText: zzqx
- hideKeyboard
- assertVisible: 'No matches for "zzqx"'
- takeScreenshot: a1-search-empty
- tapOn:
    id: activity.search.clear

# A2 categories per V2A-Categories and V2A-CategoryForm: create Pets, then delete it from the edit page's header.
# Run: scripts/device/run-flows.sh .maestro/flows/activity/categories.yaml
appId: com.anonymous.moni.e2e
name: A2 categories
tags:
  - a2
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: home.avatar
- scrollUntilVisible:
    element:
      id: profile.row.categories
    direction: DOWN
- tapOn:
    id: profile.row.categories
- assertVisible: Categories
- assertVisible: 'Presets · since .*'
- takeScreenshot: a2-categories

- tapOn:
    id: activity.categories.new
- assertVisible: New category
- tapOn:
    id: activity.category-form.name
- inputText: Pets
- hideKeyboard
- tapOn:
    id: activity.category-form.icon.heart-pulse
- tapOn:
    id: activity.category-form.colour.1
- takeScreenshot: a2-new-category
- tapOn:
    id: activity.category-form.save
- assertVisible: Pets

- tapOn: Pets
- assertVisible: Edit category
- takeScreenshot: a2-edit-category
- tapOn:
    id: activity.category-form.delete
- assertVisible: Delete Pets?
- takeScreenshot: a2-delete-sheet
- tapOn:
    id: sheet.confirm
- assertVisible: Categories
- assertNotVisible: Pets
- takeScreenshot: a2-deleted
- scrollUntilVisible:
    element:
      id: activity.categories-kind.income
    direction: UP

# An income preset opens this month's rows for it in Activity, as expense presets open their page.
- tapOn:
    id: activity.categories-kind.income
- tapOn: Salary
- assertVisible:
    id: activity.search
- assertVisible: 'Salary · .*'
- takeScreenshot: a2-income-preset

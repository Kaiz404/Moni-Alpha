# X4 a notification row shows only the date and time under its name, and its amount edit has no hint line.
# Run: scripts/device/run-flows.sh .maestro/flows/activity/txn-alert.yaml
appId: com.anonymous.moni.e2e
name: X4 transaction bank alert
tags:
  - x4
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: nav.tab.activity
- extendedWaitUntil:
    visible:
      id: activity.search
    timeout: 15000
- tapOn:
    id: activity.search
- inputText: shell
- hideKeyboard
- tapOn:
    id: 'activity\.transaction\..*'
    index: 0
- assertNotVisible: '(?i).*Alert says.*'
- tapOn:
    id: txn.amount.edit
- assertNotVisible: '(?i).*the alert said.*'
- takeScreenshot: x4-txn-alert
- tapOn:
    id: txn.amount.cancel

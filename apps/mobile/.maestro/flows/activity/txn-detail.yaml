# A2 transaction detail per V2A-TxnDetail: no ellipsis, the tiles, the note, and Delete with Keep it first.
# Run: scripts/device/run-flows.sh .maestro/flows/activity/txn-detail.yaml
appId: com.anonymous.moni.e2e
name: A2 transaction detail
tags:
  - a2
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: nav.tab.activity
- tapOn:
    id: activity.filter.type
- tapOn:
    id: sheet.option.expense
- extendedWaitUntil:
    visible:
      id: 'activity\.transaction\..*'
    timeout: 15000
- tapOn:
    id: 'activity\.transaction\..*'
    index: 0
- assertVisible: Transaction
- assertVisible:
    id: txn.amount.edit
- assertVisible:
    id: txn.tile.category
- assertVisible:
    id: txn.tile.wallet
- assertVisible: Source
- assertNotVisible: Tags
- assertNotVisible: '⋯'
- assertNotVisible: Keeps the slip with this transaction
- takeScreenshot: a2-detail

- tapOn:
    id: txn.note
- inputText: With Mei
- hideKeyboard
- assertVisible: Note saved
- assertVisible: With Mei
- takeScreenshot: a2-note

# Delete sits at the header's right: the ⋯ menu when the payment can become a bill, else the trash.
- scrollUntilVisible:
    element:
      id: txn\.(more|delete)
    direction: UP
- runFlow:
    when:
      visible:
        id: txn.more
    commands:
      - tapOn:
          id: txn.more
      - assertVisible: Make it a bill
      - takeScreenshot: a2-menu
      - tapOn:
          id: txn.menu.delete
      - assertVisible: Delete this transaction?
      - tapOn:
          id: sheet.cancel
      - tapOn:
          id: txn.more
      - tapOn:
          id: txn.menu.delete
- runFlow:
    when:
      visible:
        id: txn.delete
    commands:
      - tapOn:
          id: txn.delete
      - assertVisible: Delete this transaction?
      - tapOn:
          id: sheet.cancel
      - tapOn:
          id: txn.delete
- tapOn:
    id: sheet.confirm
- assertVisible:
    id: 'activity\.transaction\..*'
    index: 0
- takeScreenshot: a2-deleted

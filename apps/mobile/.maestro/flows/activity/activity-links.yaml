# A1 links into Activity: an income category on Categories narrows the list to that category and
# month behind one chip; clearing the chip shows every row again.
# Run: scripts/device/run-flows.sh .maestro/flows/activity/activity-links.yaml
appId: com.anonymous.moni.e2e
name: A1 Activity links
tags:
  - a1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: home.avatar
- scrollUntilVisible:
    element:
      id: profile.row.categories
    direction: DOWN
- tapOn:
    id: profile.row.categories
- tapOn:
    id: activity.categories-kind.income
- tapOn: Salary
- extendedWaitUntil:
    visible:
      id: activity.filter.category
    timeout: 5000
- assertVisible:
    id: activity.filter.category
    text: '.* · [A-Z][a-z]{2}, clear'
- takeScreenshot: a1-activity-category-link
- tapOn:
    id: activity.filter.category
- assertNotVisible:
    id: activity.filter.category
- assertVisible:
    id: activity.filter.all

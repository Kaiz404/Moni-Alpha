# A1 See all from a nested page: an income category on Categories pushes that category's rows for
# the month under Categories, and Back returns to Categories instead of landing on Activity.
# Run: scripts/device/run-flows.sh .maestro/flows/activity/activity-links.yaml
appId: com.anonymous.moni.e2e
name: A1 See all pushes a list
tags:
  - a1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: home.avatar
- scrollUntilVisible:
    element:
      id: profile.row.categories
    direction: DOWN
- tapOn:
    id: profile.row.categories
- tapOn:
    id: activity.categories-kind.income
- tapOn: Salary
- extendedWaitUntil:
    visible:
      id: list.back
    timeout: 5000
- assertVisible: Salary
- assertVisible: '\d+ transactions?'
- takeScreenshot: a1-list-category
- tapOn:
    id: list.back
- assertVisible:
    id: activity.categories-kind.income
- assertNotVisible:
    id: activity.title

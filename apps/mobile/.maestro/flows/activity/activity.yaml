# A1 Activity tab: the search bar on top of the list, the wallet filter and its chip.
# Run: scripts/device/run-flows.sh .maestro/flows/activity/activity.yaml
appId: com.anonymous.moni.e2e
name: A1 Activity tab
tags:
  - a1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: nav.tab.activity
- extendedWaitUntil:
    visible:
      id: 'activity\.transaction\..*'
    timeout: 15000
- assertVisible:
    id: activity.search
- assertVisible: 'Today · .*'
- takeScreenshot: a1-activity

- tapOn:
    id: activity.filter.wallet
- tapOn: "Touch 'n Go eWallet"
- assertVisible:
    id: activity.filter.wallet
    text: "Touch 'n Go"
- takeScreenshot: a1-wallet-chip
- tapOn:
    id: activity.filter.wallet
- tapOn: All wallets

- tapOn:
    id: activity.filter.transfer
- takeScreenshot: a1-transfers
- tapOn:
    id: activity.filter.all

- scrollUntilVisible:
    element:
      id: activity.show-more
    direction: DOWN
    optional: true
    centerElement: true
- tapOn:
    id: activity.show-more
    optional: true
- takeScreenshot: a1-show-more

- scrollUntilVisible:
    element:
      id: activity.ask-moni
    direction: UP
- tapOn:
    id: activity.ask-moni
- assertNotVisible:
    id: nav.tab.activity
- takeScreenshot: a1-moni

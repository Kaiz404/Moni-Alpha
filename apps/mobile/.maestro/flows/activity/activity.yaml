# A1 Activity tab: the search bar on top of the list, the chart and its dates, the wallet filter
# and its chip, and the pager.
# Run: scripts/device/run-flows.sh .maestro/flows/activity/activity.yaml
appId: com.anonymous.moni.e2e
name: A1 Activity tab
tags:
  - a1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: nav.tab.activity
- extendedWaitUntil:
    visible:
      id: 'activity\.transaction\..*'
    timeout: 15000
- assertVisible:
    id: activity.search
- assertVisible: 'Today · .*'
- assertVisible:
    id: activity.chart
- assertVisible:
    id: activity.range
    text: 'Dates, Last 6 months'
- assertNotVisible:
    id: activity.range.clear
- takeScreenshot: a1-activity

- tapOn:
    id: activity.range
- assertVisible:
    id: sheet.range.all-time
- takeScreenshot: a1-dates-sheet
- tapOn:
    id: sheet.range.this-month
- assertVisible:
    id: activity.range
    text: 'Dates, [A-Z][a-z]{2} \d{4}'
- takeScreenshot: a1-this-month
- tapOn:
    id: activity.range.clear
- assertNotVisible:
    id: activity.range.clear

- tapOn:
    id: activity.filter.wallet
- tapOn: "Touch 'n Go eWallet"
- assertVisible:
    id: activity.filter.wallet
    text: "Touch 'n Go"
- takeScreenshot: a1-wallet-chip
- tapOn:
    id: activity.filter.wallet
- tapOn: All wallets

- tapOn:
    id: activity.filter.transfer
- takeScreenshot: a1-transfers
- tapOn:
    id: activity.filter.all

- scrollUntilVisible:
    element:
      id: activity.pager.older
    direction: DOWN
    centerElement: true
- assertVisible:
    id: activity.pager.page
    text: 'Page 1 of \d+'
- tapOn:
    id: activity.pager.older
- assertVisible:
    id: activity.search
- extendedWaitUntil:
    visible:
      id: 'activity\.transaction\..*'
    timeout: 5000
- takeScreenshot: a1-page-2
- scrollUntilVisible:
    element:
      id: activity.pager.page
    direction: DOWN
    centerElement: true
- assertVisible:
    id: activity.pager.page
    text: 'Page 2 of \d+'

- scrollUntilVisible:
    element:
      id: activity.ask-moni
    direction: UP
- tapOn:
    id: activity.ask-moni
- assertNotVisible:
    id: nav.tab.activity
- takeScreenshot: a1-moni

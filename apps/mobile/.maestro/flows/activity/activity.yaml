# A1 Activity tab: the search bar on top of the list, the filter row of Dates, Type and
# Wallet pickers over the chart, and the pager.
# Run: scripts/device/run-flows.sh .maestro/flows/activity/activity.yaml
appId: com.anonymous.moni.e2e
name: A1 Activity tab
tags:
  - a1
  - seed-full
---
- runFlow: ../../subflows/launch.yaml
- tapOn:
    id: nav.tab.activity
- extendedWaitUntil:
    visible:
      id: 'activity\.transaction\..*'
    timeout: 15000
- assertVisible:
    id: activity.search
- assertVisible: 'Today · .*'
- assertVisible:
    id: activity.chart
- assertVisible:
    id: activity.range
    text: 'Dates, All time'
- assertNotVisible:
    id: activity.range.clear
- takeScreenshot: a1-activity

- tapOn:
    id: activity.range
- assertVisible:
    id: sheet.range.all-time
- takeScreenshot: a1-dates-sheet
- tapOn:
    id: sheet.range.this-month
- assertVisible:
    id: activity.range
    text: 'Dates, [A-Z][a-z]{2} \d{4}'
- takeScreenshot: a1-this-month
- tapOn:
    id: activity.range.clear
- assertNotVisible:
    id: activity.range.clear
- assertVisible:
    id: activity.range
    text: 'Dates, All time'

- tapOn:
    id: activity.filter.wallet
- tapOn:
    id: sheet.select-all
- tapOn: "Touch 'n Go eWallet"
- takeScreenshot: a1-wallets-sheet
- tapOn:
    id: sheet.apply
- assertVisible:
    id: activity.filter.wallet
    text: "Wallets, Touch 'n Go"
- takeScreenshot: a1-wallet-chip
- tapOn:
    id: activity.filter.wallet
- tapOn: Cash
- tapOn:
    id: sheet.apply
- assertVisible:
    id: activity.filter.wallet
    text: 'Wallets, 2 wallets'
- takeScreenshot: a1-two-wallets
- tapOn:
    id: activity.filter.wallet
- tapOn: Maybank Savings
- tapOn:
    id: sheet.cancel
- assertVisible:
    id: activity.filter.wallet
    text: 'Wallets, 2 wallets'
- tapOn:
    id: activity.filter.wallet
- tapOn:
    id: sheet.select-all
- tapOn:
    id: sheet.apply
- assertVisible:
    id: activity.filter.wallet
    text: 'Wallets, All wallets'

- tapOn:
    id: activity.filter.type
- assertVisible:
    id: sheet.option.transfer
- takeScreenshot: a1-type-sheet
- waitForAnimationToEnd
- tapOn:
    id: sheet.option.transfer
- assertVisible:
    id: activity.filter.type
    text: 'Type, Transfers'
- takeScreenshot: a1-transfers
- tapOn:
    id: activity.filter.type
- tapOn:
    id: sheet.option.all

- scrollUntilVisible:
    element:
      id: activity.pager.older
    direction: DOWN
# The pager is the list's last row: scrollUntilVisible stops once it enters the screen, under the
# floating tab bar, which then takes the tap. At the list's end it sits clear of the bar.
- scroll
- assertVisible:
    id: activity.pager.page
    text: 'Page 1 of \d+'
- tapOn:
    id: activity.pager.older
- extendedWaitUntil:
    visible:
      id: 'activity\.transaction\..*'
    timeout: 5000
- takeScreenshot: a1-page-2
- scrollUntilVisible:
    element:
      id: activity.pager.page
    direction: DOWN
    centerElement: true
- assertVisible:
    id: activity.pager.page
    text: 'Page 2 of \d+'

- scrollUntilVisible:
    element:
      id: activity.title
    direction: UP
